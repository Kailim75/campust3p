version: 2

updates:
  # « bun » et non « npm » : l'écosystème npm ne lit pas bun.lock. Les PR
  # Dependabot ne modifiaient que package.json, et la CI les refusait toutes à
  # l'étape `bun install --frozen-lockfile` (« lockfile had changes, but
  # lockfile is frozen ») — avant même le typecheck et les tests. Cinq PR sont
  # restées rouges du 15 au 24/09/2026 sans que leur contenu ait été jugé.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependances"
    commit-message:
      prefix: "chore(deps)"
    groups:
      mineures-et-patch:
        update-types:
          - "minor"
          - "patch"
    # Les majeures se font à la main, par lots, avec vérification à l'écran.
    # Proposées automatiquement, elles arrivent ÉCLATÉES (react, react-dom et
    # leurs types en quatre PR), et aucune n'est mergeable seule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
